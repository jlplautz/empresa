{% extends "base_generic.html" %}

{% block content %}
    <article>
        {% if validlink %}
            <h2>Nova Senha</h2>
            <form method="post">
                {% csrf_token %}
                {{ form }}
                <button type="submit">Alterar senha</button>
            </form>
        {% else %}
            <h2>Link invalido</h2>
            <p>Este link já foi usado ou expirou.</p>
            <a href="{% url 'password_reset' %}">Pedir um novo link</a>
        {% endif %}
    </article>  
{% endblock %}
